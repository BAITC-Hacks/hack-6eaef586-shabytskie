# Copy to secrets.toml on the server only. All values below are placeholders.
[auth]
redirect_uri = "https://procurement.example.com/oauth2callback"
cookie_secret = "REPLACE_WITH_AT_LEAST_32_RANDOM_BYTES"
client_id = "REPLACE_WITH_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_OIDC_CLIENT_SECRET"
server_metadata_url = "https://identity.example.com/.well-known/openid-configuration"
expose_tokens = []

[auth.client_kwargs]
scope = "openid profile"
prompt = "login"

[access]
issuer = "https://identity.example.com"

# Keys are immutable OIDC sub claims, not client-supplied email/role values.
[access.users]
"REPLACE_WITH_MANAGER_SUB" = "manager"
"REPLACE_WITH_ANALYST_SUB" = "analyst"
"REPLACE_WITH_VIEWER_SUB" = "viewer"
